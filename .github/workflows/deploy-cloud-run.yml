name: Deploy to Cloud Run

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/717108772864/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-deployer@investcoach.iam.gserviceaccount.com

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy investment-advisor \
            --source . \
            --project investcoach \
            --region europe-west1 \
            --no-allow-unauthenticated \
            --quiet